[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "afterglow-crypto"
version = "0.1.0"
description = "Afterglow AES-GCM + HKDF sub-key domain-separated encryption primitive"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=42.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["afterglow_crypto"]
